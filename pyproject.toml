[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dittli-tts"
version = "0.1.0"
description = "Lightweight browser-first TTS with English and German support (~1.6M params)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "soundfile",
    "g2p-en",
    "nltk",
    "transformers",
    "numba",
]

[project.optional-dependencies]
demo = [
    "gradio",
]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
dittli-tts = "dittli_tts.infer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dittli_tts*"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"benchmark.py" = ["E402", "E501", "E702", "I001"]
"benchmark_onnx.py" = ["E402", "E501"]
"app.py" = ["E402", "E501"]
"export_onnx.py" = ["E402"]
"modal_train.py" = ["E402"]
"scripts/*.py" = ["E402"]
"dittli_tts/text/__init__.py" = ["F403", "F405"]
"dittli_tts/utils/__init__.py" = ["I001"]
"dittli_tts/text/english.py" = ["E402"]
"dittli_tts/text/symbols.py" = ["E501"]
"dittli_tts/infer.py" = ["E501"]
"dittli_tts/losses.py" = ["E741"]
"dittli_tts/nn/modules.py" = ["E741"]
"dittli_tts/nn/transforms.py" = ["E741"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]
