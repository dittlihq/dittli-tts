[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dittli-tts"
version = "0.1.0"
description = "Lightweight browser-first TTS with English and German support (~1.6M params)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "soundfile",
    "g2p-en",
    "transformers",
    "numba",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
tiny-tts = "tiny_tts.infer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_tts*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]
