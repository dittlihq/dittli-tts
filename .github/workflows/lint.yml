name: Lint Check

on:
  push:
    branches: [develop]
  pull_request:

# Least privilege: linting only reads the tree.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Lint JavaScript (biome)
        run: npm run lint:js

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # Only the `lint` dependency group (ruff) — skips the heavy base deps
      # (torch etc.), which static analysis doesn't need.
      - name: Install ruff
        run: uv sync --only-group lint

      - name: Lint Python (ruff)
        run: uv run --no-sync ruff check .

      - name: Check Python formatting (ruff)
        run: uv run --no-sync ruff format --check .
