name: Lint Check

on:
  push:
    branches: [develop]
  pull_request:

# Least privilege: linting only reads the tree.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Lint JavaScript (biome)
        run: npm run lint:js

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      # Only the `lint` dependency group (ruff) — skips the heavy base deps
      # (torch etc.), which static analysis doesn't need.
      - name: Install ruff
        run: uv sync --only-group lint

      - name: Lint Python (ruff)
        run: uv run --no-sync ruff check .

      - name: Check Python formatting (ruff)
        run: uv run --no-sync ruff format --check .
